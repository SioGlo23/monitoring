name: S2 Monitor

on:
  schedule:
    # Каждые 10 минут. Время в UTC (GitHub Actions не поддерживает
    # часовые пояса в cron) — сам скрипт переводит время в МСК
    # внутри логов через переменную TIMEZONE.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в Actions, а также внешним cron-пингом (cron-job.org)

# Есть два независимых триггера (встроенный schedule + внешний пинг
# через workflow_dispatch), поэтому в теории они могут сработать почти
# одновременно. Без этого блока GitHub запустил бы их ПАРАЛЛЕЛЬНО, и
# оба прогона независимо читали/писали бы state на Google Drive — кто
# закончит позже, тот перезаписал бы работу первого (race condition).
# concurrency гарантирует, что второй запуск встанет в очередь и
# начнётся только после завершения текущего, а не одновременно с ним.
concurrency:
  group: s2-monitor
  cancel-in-progress: false

# Право actions:write нужно, чтобы monitor.py мог сам запустить workflow
# "S2 Process" через GitHub API сразу же, как только появляется задание
# на обработку — не дожидаясь расписания process.yml.
permissions:
  contents: read
  actions: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9   # прогон должен укладываться в 10-минутный интервал

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          M2M_USERNAME: ${{ secrets.M2M_USERNAME }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_TOKEN: ${{ secrets.M2M_TOKEN }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TIMEZONE: "Europe/Moscow"
          # Специальный токен, который GitHub Actions создаёт автоматически
          # на каждый запуск (заводить его самостоятельно не нужно) —
          # monitor.py использует его, чтобы запустить "S2 Process".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Токен Telegram-бота: без него уведомления в Telegram просто
          # не отправляются, почта работает как обычно.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py
