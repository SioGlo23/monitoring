name: Keepalive

# GitHub автоматически отключает scheduled-workflow, если в репозитории
# 60 дней не было НИКАКОЙ активности. Этот workflow раз в неделю делает
# пустой коммит — чисто чтобы "сбросить таймер" и не дать основному
# мониторингу молча остановиться.

on:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник в 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty keep-alive commit
        run: |
          git config user.name "s2-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keep-alive: не даём GitHub уснуть на расписании"
          git push
