name: Keepalive

# GitHub автоматически отключает scheduled-workflow, если в репозитории
# 60 дней не было НИКАКОЙ активности. Этот workflow раз в неделю делает
# пустой коммит -- чисто чтобы "сбросить таймер" и не дать основному
# мониторингу молча остановиться.

on:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник в 03:00 UTC
  workflow_dispatch: {}

# ВАЖНО: без этого блока GITHUB_TOKEN, который использует job, выдаётся
# с правами read-only на содержимое репозитория (это дефолт, если в
# Settings -> Actions -> General -> Workflow permissions не включено
# "Read and write permissions" вручную). git push тогда падает с
# "Permission ... denied to github-actions[bot]" / 403. Явное указание
# permissions здесь работает независимо от настроек репозитория и не
# требует захода в Settings.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty keep-alive commit
        run: |
          git config user.name "s2-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keep-alive: не даём GitHub уснуть на расписании"
          git push
